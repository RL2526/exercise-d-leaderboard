<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Exercise D – Leaderboard</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
  }
  h1 {
    margin-bottom: 5px;
  }
  #updated {
    color: #666;
    margin-bottom: 20px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th {
    background: #f0f0f0;
    cursor: pointer;
    padding: 8px;
    border: 1px solid #a18d8d;
  }
  td {
    padding: 6px 8px;
    border: 1px solid #ccc;
  }
  tr:nth-child(even) {
    background: #fafafa;
  }

  /* Tier visuals */
  tr.tier-divider td {
    padding: 0;
    height: 10px;
    background: #333;
    border: none;
  }
  tr.tier-label td {
    background: #222;
    color: white;
    font-weight: bold;
    text-align: center;
    padding: 6px;
    border: none;
  }
</style>
</head>

<body>

<h1>Exercise D – Leaderboard</h1>
<div id="updated">Loading...</div>

<table id="leaderboard">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Student</th>
      <th>Current Avg return</th>
      <th>Max Avg return</th>
      <th>Last updated</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// -------------------------------------------------------------
// FETCH LEADERBOARD.JSON
// -------------------------------------------------------------
fetch('leaderboard.json?v=20260105')
  .then(r => r.json())
  .then(data => renderLeaderboard(data))
  .catch(err => {
    document.getElementById('updated').innerText =
      "Failed to load leaderboard.json";
    console.error(err);
  });

// -------------------------------------------------------------
// RENDER LEADERBOARD WITH TIERS
// -------------------------------------------------------------
function renderLeaderboard(data) {
  const entries = data.entries || [];

  document.getElementById('updated').innerText =
    "Last updated: " + data.generated_at;

  const tbody = document.querySelector("#leaderboard tbody");
  tbody.innerHTML = "";

  const tiers = [
    { name: "💪 All 4 opponents beaten!", min: 4.0 },
    { name: "👏 3 opponents beaten",      min: 3.0 },
    { name: "👍 2 opponents beaten",      min: 2.0 },
    { name: "🤔 1 opponent beaten",       min: 1.0 },
    { name: "No opponents beaten yet",    min: 0.0 }
  ];

  let rank = 1;

  tiers.forEach(tier => {
    const group = entries.filter(e =>
      Number(e.max_score) >= tier.min &&
      (tier.min === 4 || Number(e.max_score) < tier.min + 1)
    );

    if (group.length === 0) return;

    const label = document.createElement("tr");
    label.className = "tier-label";
    label.innerHTML = `<td colspan="5">${tier.name}</td>`;
    tbody.appendChild(label);

    group.forEach(e => {
      const tr = document.createElement("tr");

      const isEpoch =
        e.timestamp === 0 ||
        e.timestamp === "0" ||
        e.timestamp === "1970-01-01T00:00:00";

      const hasSubmission = !isEpoch;

      const avg = hasSubmission ? Number(e.avg_return).toFixed(3) : "no submission yet";
      const max = hasSubmission ? Number(e.max_score).toFixed(3) : "no submission yet";
      const ts  = hasSubmission
        ? new Date(e.timestamp).toLocaleString()
        : "no submission yet";

      tr.innerHTML = `
        <td>${rank++}</td>
        <td>${e.student}</td>
        <td>${avg}</td>
        <td>${max}</td>
        <td>${ts}</td>
      `;

      tbody.appendChild(tr);
    });

    const div = document.createElement("tr");
    div.className = "tier-divider";
    div.innerHTML = `<td colspan="5"></td>`;
    tbody.appendChild(div);
  });

  makeSortable();
}

// -------------------------------------------------------------
// SIMPLE TABLE SORTING
// -------------------------------------------------------------
function makeSortable() {
  const table = document.getElementById("leaderboard");
  const headers = table.querySelectorAll("th");

  headers.forEach((th, index) => {
    th.addEventListener("click", () => {
      const rows = Array.from(table.querySelectorAll("tbody tr"))
        .filter(r => !r.classList.contains("tier-label") &&
                     !r.classList.contains("tier-divider"));

      const asc = th.dataset.asc === "true";

      rows.sort((a, b) => {
        const x = a.children[index].innerText;
        const y = b.children[index].innerText;

        const nx = parseFloat(x);
        const ny = parseFloat(y);

        if (!isNaN(nx) && !isNaN(ny)) {
          return asc ? nx - ny : ny - nx;
        }
        return asc ? x.localeCompare(y) : y.localeCompare(x);
      });

      const tbody = table.querySelector("tbody");
      tbody.querySelectorAll("tr").forEach(r => r.remove());
      rows.forEach(r => tbody.appendChild(r));
    });
  });
}
</script>

</body>
</html>
